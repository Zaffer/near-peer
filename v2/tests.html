<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Near Peer v2 — rule tests</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 24px; background: #f6f3ec; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; font-weight: 700; }
    li { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>Near Peer v2 — tests</h1>
  <div id="summary"></div>
  <ul id="results"></ul>

  <script type="module">
    import { results as rules } from './tests/rules.test.js';
    import { results as online } from './tests/online.test.js';

    const results = rules.concat(online);
    const failed = results.filter((r) => !r.ok);
    document.getElementById('summary').innerHTML =
      `<p class="${failed.length ? 'fail' : 'pass'}">${results.length - failed.length}/${results.length} passed</p>`;
    document.getElementById('results').innerHTML = results.map((r) =>
      `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ` — ${r.err}`}</li>`).join('');
  </script>
</body>
</html>
