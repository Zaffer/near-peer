# Every day: fetch the games played on the website from GoatCounter into data/games.json,
# which stats.html and the replay viewer read (tools/games.js). Needs the repository secret
# GOATCOUNTER_TOKEN: an API token from the GoatCounter site, allowed to read statistics.
# "Run workflow" on the Actions tab runs it straight away.
name: Games played

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: games

jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun tools/games.js --out data/games.json
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - name: Commit data/games.json if it changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json
          if ! git diff --cached --quiet; then
            git commit -m 'Games played: update data/games.json'
            git push
          fi
