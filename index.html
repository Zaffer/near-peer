<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Near Peer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="hover-info" class="hover-info"></div>
    </section>
    <aside id="panel" class="panel"></aside>
  </main>
  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <!-- ES modules: ui.js imports the rest. Browsers won't load modules from a file, so serve the folder (see README). -->
  <script type="module" src="js/ui.js"></script>
</body>
</html>
