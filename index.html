<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Near Peer</title>
  <meta name="description" content="A two-player hex strategy game. Blue vs Red: use terrain, fortify, merge units and capture. Free in the browser, online or against the computer.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#262320">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Link previews (X, Facebook, WhatsApp, Discord, Slack...). Crawlers need absolute URLs, so these point at GitHub Pages. -->
  <link rel="canonical" href="https://zaffer.github.io/near-peer/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Near Peer">
  <meta property="og:title" content="Near Peer">
  <meta property="og:description" content="A two-player hex strategy game. Blue vs Red: use terrain, fortify, merge units and capture.">
  <meta property="og:url" content="https://zaffer.github.io/near-peer/">
  <meta property="og:image" content="https://zaffer.github.io/near-peer/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Near Peer hex board with Blue and Red units either side of a river">
  <!-- A player card: X shows the game itself in the post (it plays the computer), with twitter:image before it loads. -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:player" content="https://zaffer.github.io/near-peer/?vs=easy">
  <meta name="twitter:player:width" content="600">
  <meta name="twitter:player:height" content="600">
  <meta name="twitter:site" content="@_jameswiles">
  <meta name="twitter:creator" content="@_jameswiles">
  <meta name="twitter:title" content="Near Peer">
  <meta name="twitter:description" content="A two-player hex strategy game. Blue vs Red: use terrain, fortify, merge units and capture.">
  <meta name="twitter:image" content="https://zaffer.github.io/near-peer/og-image.png">
  <meta name="twitter:image:alt" content="The Near Peer hex board with Blue and Red units either side of a river">
  <link rel="stylesheet" href="style.css">
  <script>
    // The remembered theme (Light / Dark), applied before the page draws. Auto follows the system.
    try {
      const t = localStorage.getItem('near-peer:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* private window etc. */ }
  </script>
</head>
<body>
  <main class="game">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="topbar">
      <div id="status" class="status-pill"></div>
      <a id="pop-out" class="button menu-btn pop-out" target="_blank" rel="noopener" title="Open in a new tab" hidden>↗</a>
      <button id="menu-open" class="menu-btn" aria-label="Menu" aria-controls="sheet" aria-expanded="false">☰<span class="menu-label"> Menu</span></button>
    </div>
    <div class="dock">
      <section id="replay" class="card replay" hidden></section>
      <div id="dock-cards" class="dock-cards"></div>
      <div id="hover-info" class="hover-info"></div>
    </div>
  </main>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-inner">
      <header class="sheet-head title">
        <h1>Near Peer</h1>
        <button id="menu-close" class="menu-btn" aria-label="Close menu">✕ Close</button>
      </header>
      <div id="panel" class="panel"></div>
    </div>
  </div>
  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <!-- Anonymous statistics (GoatCounter, no cookies): page views, and each game played as an event (js/stats.js).
       tools/games.js reads the site's address from here. -->
  <script data-goatcounter="https://nearpeer.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <!-- ES modules: ui.js imports the rest. Browsers won't load modules from a file, so serve the folder (see README). -->
  <script type="module" src="js/ui.js"></script>
</body>
</html>
